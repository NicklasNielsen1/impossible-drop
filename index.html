<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impossible Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root { --paper: #efe6d3; --ink: #2b2620; --soft: #6d6254; --card: rgba(246, 239, 223, .94); --line: #b9aa8c; --accent: #9b3d2c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: "IM Fell English", Georgia, serif; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: default; }
  .panel { background: var(--card); border: 1.5px solid var(--ink); border-radius: 4px; padding: 10px 12px;
    box-shadow: 3px 3px 0 rgba(43, 38, 32, .18); }
  #hud { position: fixed; top: 12px; left: 12px; max-width: min(420px, calc(100% - 150px)); pointer-events: none; }
  #hud h1 { margin: 0; font-size: 19px; font-weight: normal; }
  #hud p { margin: 3px 0 0; font-size: 14px; color: var(--soft); font-style: italic; }
  #hud .count { color: var(--ink); font-style: normal; }
  #corner { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; flex-direction: column; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: #f6efdf; border: 1.5px solid var(--ink);
    border-radius: 4px; padding: 5px 12px; cursor: pointer; }
  button:hover { background: #fffaf0; }
  button.primary { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .4; cursor: default; }
  @media (pointer: coarse), (max-width: 700px) {
    #corner button { padding: 8px 10px; }
    #hud { padding: 7px 9px; max-width: calc(100% - 120px); }
  }
  /* Narrow screens (phones held upright): the buttons go in a row along the bottom. */
  @media (max-width: 700px) {
    #corner { top: auto; bottom: 10px; left: 8px; right: 8px; flex-direction: row; flex-wrap: wrap; justify-content: center; }
    #hud { max-width: calc(100% - 24px); }
    #hud h1 { font-size: 16px; }
    #hud p { font-size: 12.5px; margin-top: 2px; }
  }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(239, 230, 211, .7); padding: 16px; overflow: auto; }
  .card { width: min(540px, 100%); max-height: 100%; overflow: auto; text-align: center; padding: 20px; }
  .card h2 { margin: 0 0 4px; font-size: 30px; font-weight: normal; letter-spacing: 2px; }
  .card p { margin: 4px 0 12px; color: var(--soft); font-size: 15px; }
  .world { text-align: left; margin-top: 14px; }
  .world h3 { margin: 0 0 6px; font-size: 15px; color: var(--soft); font-weight: normal; font-style: italic; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .lvl { padding: 7px 4px; text-align: center; line-height: 1.25; }
  .lvl b { display: block; font-size: 14px; font-weight: normal; }
  .lvl span { font-size: 14px; color: var(--accent); letter-spacing: 1px; }
  .lvl span i { color: var(--line); font-style: normal; }
  .stars { font-size: 40px; color: var(--accent); letter-spacing: 6px; margin: 6px 0; }
  .stars i { color: var(--line); font-style: normal; }
  .rowc { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="panel" hidden>
  <h1 id="lvlName"></h1>
  <p id="lvlHint"></p>
  <p class="count" id="lvlCount"></p>
</div>

<div id="corner" hidden>
  <button id="btnMenu">Levels</button>
  <button id="btnRestart">Restart</button>
  <button id="btnSolution">Solution</button>
  <button id="btnFast"></button>
  <button id="btnSound"></button>
</div>

<div id="menu" class="overlay">
  <div class="card panel">
    <h2>IMPOSSIBLE DROP</h2>
    <p>Balls fall from the hopper and roll along the tracks. Tap a joint to turn it and steer them into the baskets. Only the picture counts: if two tracks <i>look</i> joined, they <i>are</i> joined.</p>
    <p id="devNote" hidden style="color:#9b3d2c">Dev mode: all levels unlocked. Type "dev" again to turn it off.</p>
    <div id="worlds"></div>
    <div class="rowc"><button onclick="location.href = 'sandbox.html'">Sandbox: build your own</button></div>
    <!-- TEMPORARY, for testing on a phone: remove this button (and its line in showMenu and
         its onclick below) when it is no longer needed. Typing "dev" keeps working without it. -->
    <div class="rowc"><button id="btnDev" style="opacity:.6;font-size:12px"></button></div>
  </div>
</div>

<div id="win" class="overlay" hidden>
  <div class="card panel">
    <h2 id="winTitle"></h2>
    <div class="stars" id="winStars"></div>
    <p id="winText"></p>
    <div class="rowc">
      <button id="btnWinRestart">Play again</button>
      <button id="btnWinMenu">Levels</button>
      <button id="btnNext" class="primary">Next level</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="draw.js"></script>
<script src="levels/world1.js"></script>
<script src="levels/world2.js"></script>
<script src="levels/world3.js"></script>
<script>
const D = ImpossibleDrop;
const LEVELS = globalThis.LEVELS || [];
const WORLD_NAMES = { 1: 'World 1 · Joints and Stairs', 2: 'World 2 · Colours', 3: 'World 3 · Turning Towers' };
const worldOf = level => +level.id.match(/^w(\d+)/)[1];
const $ = id => document.getElementById(id);
const STAR = '★', LOCK = '🔒', MIDDOT = '·';

// ---------- Saved progress ----------
// Stars per level are kept in localStorage, the browser's small per-site storage.
const SAVE_KEY = 'impossible-drop-progress';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { progress = {}; }
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {} }
// Dev mode opens every level for testing. Turn it on or off by typing the letters d, e, v
// anywhere on the page (or add ?unlock to the address). It is remembered in this browser.
const DEV_KEY = 'impossible-drop-dev';
let unlockAll = location.search.includes('unlock');
try { unlockAll = unlockAll || localStorage.getItem(DEV_KEY) === '1'; } catch (e) {}
let typed = '';
addEventListener('keydown', e => {
  if (e.key.length !== 1) return;
  typed = (typed + e.key.toLowerCase()).slice(-3);
  if (typed !== 'dev') return;
  typed = '';
  toggleDev();
});
function toggleDev() {
  unlockAll = !unlockAll;
  try { localStorage.setItem(DEV_KEY, unlockAll ? '1' : '0'); } catch (e) {}
  if (mode === 'menu') showMenu(); else say(unlockAll ? 'Dev mode on: all levels unlocked' : 'Dev mode off');
}
const isUnlocked = i => unlockAll || i === 0 || progress[LEVELS[i - 1].id] > 0;

// ---------- Sound ----------
// Sounds are made on the spot with the browser's built-in synthesizer (no sound files).
// Browsers only allow sound after the first tap or click, so it starts then.
const MUTE_KEY = 'impossible-drop-mute';
let muted = false, audio = null, lastSound = {};
try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
function wakeAudio() {
  if (audio || muted) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
function beep(kind, freq, dur, type, vol, gap, delay) {
  if (muted || !audio) return;
  const now = audio.currentTime;
  if (gap && now - (lastSound[kind] || -9) < gap) return;
  lastSound[kind] = now;
  try {
    const o = audio.createOscillator(), g = audio.createGain(), t0 = now + (delay || 0);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function setMuted(m) {
  muted = m;
  try { localStorage.setItem(MUTE_KEY, m ? '1' : '0'); } catch (e) {}
  $('btnSound').textContent = m ? 'Sound: off' : 'Sound: on';
  if (!m) wakeAudio();
}

// ---------- Game state ----------
const canvas = $('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, scale = 40, ox = 0, oy = 0;
let mode = 'menu';            // 'menu' | 'play' | 'winning' (a short pause) | 'won'
let levelIndex = 0, level = null, g = null;
let fast = false, usedSolution = false, autoTaps = [], winTimer = 0;
let sparks = [], message = null, clock = 0, stepBank = 0, outShown = false;

function say(text, secs) { message = { until: clock + (secs || 2.4), text }; }

function startLevel(i, keepSolution) {
  if (!LEVELS[i]) return;
  levelIndex = i; level = LEVELS[i];
  g = D.createGame(level);
  if (!keepSolution) { usedSolution = false; autoTaps = []; }
  sparks = []; message = null; stepBank = 0; outShown = false;
  mode = 'play';
  $('menu').hidden = true; $('win').hidden = true;
  $('hud').hidden = false; $('corner').hidden = false;
  $('lvlName').textContent = `${level.id.slice(1)} ${level.name}`;
  $('lvlHint').textContent = level.hint;
  fit();
  refreshUI();
}

function showMenu() {
  mode = 'menu';
  $('hud').hidden = true; $('corner').hidden = true; $('win').hidden = true;
  $('menu').hidden = false;
  $('devNote').hidden = !unlockAll;
  $('btnDev').textContent = unlockAll ? 'Dev mode: on (tap to turn off)' : 'Dev mode: off (tap to unlock all levels)';
  const box = $('worlds');
  box.innerHTML = '';
  let grid = null, lastWorld = 0;
  LEVELS.forEach((lv, i) => {
    const w = worldOf(lv);
    if (w !== lastWorld) {
      lastWorld = w;
      const sec = document.createElement('div');
      sec.className = 'world';
      sec.innerHTML = '<h3>' + (WORLD_NAMES[w] || 'World ' + w) + '</h3><div class="grid"></div>';
      box.appendChild(sec);
      grid = sec.lastChild;
    }
    const b = document.createElement('button');
    b.className = 'lvl';
    const open = isUnlocked(i), stars = progress[lv.id] || 0;
    b.disabled = !open;
    b.innerHTML = '<b>' + lv.id.slice(1) + ' ' + lv.name + '</b><span>' + (open ? STAR.repeat(stars) + '<i>' + STAR.repeat(3 - stars) + '</i>' : LOCK) + '</span>';
    b.onclick = () => { wakeAudio(); startLevel(i); };
    grid.appendChild(b);
  });
}

const parText = () => level.par === 1 ? '1 tap' : `${level.par} taps or fewer`;

function refreshUI() {
  if (!g) return;
  const left = g.total - g.dropped;
  $('lvlCount').textContent = `Taps: ${g.taps} ${MIDDOT} 3 stars: ${parText()} ${MIDDOT} balls left: ${left}`;
  $('btnFast').textContent = fast ? 'Speed: fast' : 'Speed: normal';
}

function useSolution() {
  startLevel(levelIndex, true);
  usedSolution = true;
  autoTaps = level.solution.slice().sort((a, b) => a.t - b.t);
  say('Watch the built-in solution.');
}

function tapRotor(id) {
  if (mode !== 'play') return;
  const r = g.rotors.find(r => r.id === id);
  if (r && r.auto) { say('That one is a flip-switch: it turns by itself when a ball rolls off it.'); return; }
  if (!D.tap(g, id)) return;
  refreshUI();
}

// ---------- Running the game ----------
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = (speed || 3) * (0.2 + Math.random() * 0.8);
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 0.3 + Math.random() * 0.4, color });
  }
}

function stepOnce() {
  while (autoTaps.length && autoTaps[0].t <= g.t + 1e-9) D.tap(g, autoTaps.shift().rotor);
  D.step(g);
  for (const e of g.events.splice(0)) {
    if (e.type === 'drop') { beep('drop', 330, 0.05, 'triangle', 0.03, 0.05); refreshUI(); }
    else if (e.type === 'land') beep('land', 180 + Math.random() * 30, 0.05, 'triangle', 0.05, 0.04);
    else if (e.type === 'turn') { beep('turn', e.auto ? 900 : 620, 0.04, 'square', 0.02, 0.02); refreshUI(); }
    else if (e.type === 'basket') {
      burst(e.x, e.y, '#9b3d2c', 10);
      beep('basket', e.full ? 784 : 523, 0.25, 'sine', 0.08, 0.03);
    }
    else if (e.type === 'spill') { burst(e.x, e.y, '#2b2620', 16, 4); beep('spill', 110, 0.3, 'sawtooth', 0.05, 0.1); say('Wrong colour! That basket spilled.'); }
    else if (e.type === 'lost') beep('lost', 90, 0.12, 'sine', 0.04, 0.1);
    else if (e.type === 'win') onWin();
  }
  if (g.out && !outShown && mode === 'play') { outShown = true; say('Out of balls. Tap Restart to try again.', 9999); }
}

function onWin() {
  [523, 659, 784, 1047].forEach((f, i) => beep('win' + i, f, 0.3, 'triangle', 0.07, 0, i * 0.11));
  for (const k of g.baskets) burst(k.scr[0], k.scr[1], '#9b3d2c', 30, 5);
  mode = 'winning'; winTimer = 1.0;
}

function showWin() {
  const used = g.taps;
  let stars = used <= level.par ? 3 : used <= level.par + 2 ? 2 : 1;
  if (usedSolution) stars = 1;
  progress[level.id] = Math.max(progress[level.id] || 0, stars);
  saveProgress();
  mode = 'won';
  $('winTitle').textContent = 'Baskets full!';
  $('winStars').innerHTML = STAR.repeat(stars) + '<i>' + STAR.repeat(3 - stars) + '</i>';
  $('winText').textContent = usedSolution ? 'That was the built-in solution, so it counts for 1 star. Try it your own way for more.'
    : `You used ${used} tap${used === 1 ? '' : 's'}. For three stars: ${parText()}.`;
  $('btnNext').hidden = levelIndex >= LEVELS.length - 1;
  $('win').hidden = false;
}

function advance(dt) {
  clock += dt;
  for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 6 * dt; s.life -= dt; }
  sparks = sparks.filter(s => s.life > 0);
  if (!g || (mode !== 'play' && mode !== 'winning')) return;
  if (mode === 'winning') { winTimer -= dt; if (winTimer <= 0) { showWin(); return; } }
  stepBank += dt * (fast ? 2 : 1);
  while (stepBank >= D.DT) { stepBank -= D.DT; stepOnce(); }
}

// ---------- Screen positions ----------
// The level's own screen units (see engine.js) are scaled to fit the window.
function fit() {
  if (!level || !g) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const add = (p, m) => { x0 = Math.min(x0, p[0] - m); x1 = Math.max(x1, p[0] + m); y0 = Math.min(y0, p[1] - m); y1 = Math.max(y1, p[1] + m); };
  for (const tr of g.tracks) for (const p of D.allPositions(tr)) add(D.project(p), 0.6);
  for (const b of level.blocks || []) { add(D.project(b), 1); add(D.project([b[0], b[1], b[2] - 1]), 1); }
  for (const r of g.rotors) for (const b of r.blocks) for (let q = 0; q < 4; q++) {
    const p = D.turnPoint(r.at, b, q); add(D.project(p), 1); add(D.project([p[0], p[1], p[2] - 1]), 1);
  }
  add([g.hopperScr[0], g.hopperScr[1] - 1.2], 0.8);
  for (const k of g.baskets) { add(k.scr, 0.8); add([k.scr[0], k.scr[1] + 1.4], 0.3); }
  const hud = $('hud').getBoundingClientRect(), narrow = W < 700;
  const top = Math.max(narrow ? 96 : 86, hud.bottom + 50), side = narrow ? 16 : 30;
  // On narrow screens the buttons sit along the bottom, otherwise down the right-hand side.
  const bottom = narrow ? H - $('corner').getBoundingClientRect().top + 50 : 60;
  const right = narrow ? side : 130;
  scale = Math.max(4, Math.min((W - side - right) / (x1 - x0), (H - top - bottom) / (y1 - y0), 70));
  ox = side + ((W - side - right) - (x1 - x0) * scale) / 2 - x0 * scale;
  oy = top + ((H - top - bottom) - (y1 - y0) * scale) / 2 - y0 * scale;
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fit();
}

// Which rotor is under this spot on the screen (or null)?
function rotorAt(mx, my) {
  let best = null, bd = Infinity;
  for (const r of g.rotors) {
    const hub = toScreen(D.project(r.at));
    let d = Math.hypot(mx - hub[0], my - hub[1]) - 6;
    for (const tr of r.tracks) for (let i = 0; i + 1 < tr.scr.length; i++)
      d = Math.min(d, segDist(mx, my, toScreen(tr.scr[i]), toScreen(tr.scr[i + 1])));
    if (d < Math.max(24, scale * 0.7) && d < bd) { bd = d; best = r; }
  }
  return best;
}
function segDist(x, y, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / L)) : 0;
  return Math.hypot(x - a[0] - t * dx, y - a[1] - t * dy);
}

// ---------- Touch and mouse ----------
canvas.addEventListener('pointerdown', e => {
  wakeAudio();
  if (mode !== 'play') return;
  const r = rotorAt(e.clientX, e.clientY);
  if (r) { if (usedSolution) { say('The solution is playing. Tap Restart to play yourself.'); return; } tapRotor(r.id); }
});
canvas.addEventListener('pointermove', e => {
  canvas.style.cursor = mode === 'play' && rotorAt(e.clientX, e.clientY) ? 'pointer' : 'default';
});

$('btnMenu').onclick = showMenu;
$('btnRestart').onclick = () => { wakeAudio(); startLevel(levelIndex); };
$('btnSolution').onclick = () => { wakeAudio(); useSolution(); };
$('btnFast').onclick = () => { fast = !fast; refreshUI(); };
$('btnSound').onclick = () => setMuted(!muted);
$('btnWinMenu').onclick = showMenu;
$('btnWinRestart').onclick = () => startLevel(levelIndex);
$('btnNext').onclick = () => startLevel(levelIndex + 1);
$('btnDev').onclick = toggleDev;   // TEMPORARY (see the note next to the button above)

function draw() {
  ctx.fillStyle = '#efe6d3'; ctx.fillRect(0, 0, W, H);
  if (!level || !g || mode === 'menu') return;
  drawWorld(level, g);

  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 2.5)); ctx.fillStyle = s.color;
    ctx.fillRect(px([s.x]) - 1.5, py([0, s.y]) - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  if (message && message.text && clock < message.until) {
    ctx.font = '16px "IM Fell English", Georgia, serif'; ctx.textAlign = 'center';
    const tw = Math.min(W - 24, ctx.measureText(message.text).width + 28);
    const y = W < 700 ? $('corner').getBoundingClientRect().top - 24 : H - 34;
    ctx.fillStyle = 'rgba(43, 38, 32, .9)'; ctx.fillRect(W / 2 - tw / 2, y - 19, tw, 30);
    ctx.fillStyle = '#f7f0e0'; ctx.fillText(message.text, W / 2, y + 1, tw - 16);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  advance(dt); draw();
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
setMuted(muted);
showMenu();
requestAnimationFrame(frame);

// A handle for testing from the browser console, for example:
//   game.startLevel(2); game.useSolution(); game.run(30)
window.game = {
  levels: LEVELS, startLevel, showMenu, useSolution, tap: tapRotor, advance, draw,
  // Run the game for up to this many seconds of game time, without waiting. Says whether the level was won.
  run(seconds) {
    for (let k = 0; k < seconds / D.DT && mode === 'play'; k++) stepOnce();
    if (mode === 'winning') showWin();
    return mode === 'won';
  },
  get mode() { return mode; }, get state() { return g; }, get progress() { return progress; },
  get message() { return message && message.text; }, get muted() { return muted; },
};
</script>
</body>
</html>
